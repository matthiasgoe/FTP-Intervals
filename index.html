<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZWO &amp; FIT Player</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">
<meta name="theme-color" content="#eceff3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1015" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;font-size:14px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
img{max-width:100%}
[hidden]{display:none!important}
button,input,label{touch-action:manipulation}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a bike head unit — giant target watts + countdown on top, workout profile strip, thumb-sized controls; interval list beside on wide screens, below on phones. */
:root{
  --bg:#eceff3; --surface:#ffffff; --line:#d5dbe2; --fg:#111820; --muted:#5a6673; --accent:#1d5fd6; --on-accent:#ffffff;
  --z0:#a9b1ba; --z1:#8c96a2; --z2:#2f7fd0; --z3:#2a9b57; --z4:#d8a200; --z5:#e2671d; --z6:#d03636; --z7:#9a378d;
  --ink:#0f141a; --paper:#ffffff;
  --f-num:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1015; --surface:#141a21; --line:#27313c; --fg:#e7ecf1; --muted:#8f9bab; --accent:#6c9fff; --on-accent:#0c1015;
    --z0:#4b5663; --z1:#7d8896; --z2:#4a95e6; --z3:#3fb86d; --z4:#f0bd1d; --z5:#f5813a; --z6:#ec5050; --z7:#c056b2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1015; --surface:#141a21; --line:#27313c; --fg:#e7ecf1; --muted:#8f9bab; --accent:#6c9fff; --on-accent:#0c1015;
  --z0:#4b5663; --z1:#7d8896; --z2:#4a95e6; --z3:#3fb86d; --z4:#f0bd1d; --z5:#f5813a; --z6:#ec5050; --z7:#c056b2;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px}
.app{max-width:1180px;margin:0 auto;padding-block:14px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
body.dragging .app{outline:2px dashed var(--accent);outline-offset:-6px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.wk{min-width:0;flex:1 1 260px;display:flex;flex-direction:column;gap:3px}
.eyebrow{font:500 11px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);overflow-wrap:anywhere}
h1{font:700 28px/1.05 var(--f-num);margin:0;text-wrap:balance;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ftp{display:flex;align-items:center;gap:6px;height:42px;padding:0 10px;border:1px solid var(--line);background:var(--surface);border-radius:9px;font:500 11px var(--f-mono);letter-spacing:.06em;color:var(--muted)}
.ftp input{width:4.2ch;border:0;background:transparent;color:var(--fg);font:700 22px var(--f-num);text-align:right;font-variant-numeric:tabular-nums;padding:0}
.ftp input:focus{outline:none}
.ftp:focus-within{border-color:var(--accent)}
.btn{height:42px;padding:0 16px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:600;font-size:14px}
.err{margin:0;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--z6) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--z6) 50%,var(--line));font-size:14px}

.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){
  .grid{grid-template-columns:minmax(0,1fr) 350px;align-items:start}
  .list ol{max-height:calc(100vh - 190px);overflow-y:auto}
}
.player{display:flex;flex-direction:column;gap:12px;min-width:0}
.readout{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:560px){.readout{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}

.target,.clock{border-radius:14px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.target{--zone:var(--z1);background:color-mix(in srgb,var(--zone) 17%,var(--surface));border:1px solid color-mix(in srgb,var(--zone) 50%,var(--line))}
.clock{background:var(--surface);border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.label{font:500 11px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip{font:600 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:999px;background:var(--zone);color:var(--ink);white-space:nowrap}
.chip[data-z="2"],.chip[data-z="6"],.chip[data-z="7"]{color:var(--paper)}
.stepname{font:600 22px/1.15 var(--f-num);overflow-wrap:anywhere;margin-top:4px}
.big{font-family:var(--f-num);font-weight:700;font-size:clamp(72px,min(25vw,18vh),168px);line-height:.88;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:2px}
.big .u{font-size:.3em;font-weight:600;margin-left:.1em;color:var(--muted);letter-spacing:0}
.sub{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.clock .big{margin-top:auto}
.pbar{height:8px;border-radius:4px;background:color-mix(in srgb,var(--line) 70%,var(--bg));overflow:hidden;margin-top:12px}
.pbar i{display:block;height:100%;width:0;background:var(--fg)}

.cue{padding:10px 12px;border-radius:10px;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface));font-size:15px;overflow-wrap:anywhere}
.next{font-size:14px;color:var(--muted);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.next b{color:var(--fg);font-weight:600}
.profile{height:104px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;max-width:100%}
.profile canvas{display:block;width:100%;height:100%;cursor:pointer}
.totals{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.totals b{color:var(--fg);font:600 17px var(--f-num);font-variant-numeric:tabular-nums;margin-left:4px}

.controls{display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:10px}
.controls button{height:64px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:16px}
.controls button svg{width:20px;height:20px;fill:currentColor}
#play{background:var(--fg);color:var(--bg);border-color:var(--fg);font-size:18px}
.aux{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.aux label{display:flex;align-items:center;gap:6px;cursor:pointer}
.aux input{accent-color:var(--accent);width:16px;height:16px}
.link{border:0;background:none;padding:6px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.link.armed{color:var(--z6);font-weight:600}

.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding-block:12px 4px;min-width:0}
.list h2{margin:0;padding:0 14px 10px;font:500 11px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.list ol{list-style:none;margin:0;padding:0;position:relative}
.list li button{width:100%;display:grid;grid-template-columns:2.4ch 10px minmax(0,1fr) auto 9.5ch;gap:10px;align-items:center;padding:10px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;font-size:14px}
.list li button:hover{background:color-mix(in srgb,var(--fg) 4%,var(--surface))}
.list li[aria-current] button{background:color-mix(in srgb,var(--accent) 13%,var(--surface))}
.list li.past button{color:var(--muted)}
.num{font:500 11px var(--f-mono);color:var(--muted);text-align:right}
.dot{width:10px;height:10px;border-radius:3px;background:var(--zone)}
.nm{min-width:0;overflow-wrap:anywhere}
.t,.w{font:500 12px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.w{font:600 15px var(--f-num)}
@media (prefers-reduced-motion:no-preference){.pbar i{transition:width .2s linear}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="wk">
      <span class="eyebrow" id="src">Sample workout</span>
      <h1 id="wkName">Sweet Spot 3×10</h1>
      <span class="meta" id="wkMeta"></span>
    </div>
    <div class="tools">
      <label class="ftp" for="ftp">FTP<input id="ftp" type="number" inputmode="numeric" min="50" max="700" value="200">W</label>
      <button class="btn" id="loadBtn" type="button">Load .zwo / .fit</button>
      <input type="file" id="file" hidden>
    </div>
  </header>
  <p class="err" id="err" hidden></p>

  <main class="grid">
    <section class="player" aria-label="Player">
      <div class="readout">
        <div class="target" id="panel">
          <div class="row"><span class="label" id="stepNo">Step 1 / 8</span><span class="chip" id="chip" data-z="1">Z1</span></div>
          <div class="stepname" id="stepName">Warm-up</div>
          <div class="big"><span id="watts">100</span><span class="u">W</span></div>
          <div class="sub" id="sub"></div>
        </div>
        <div class="clock">
          <span class="label" id="remainLabel">Interval left</span>
          <div class="big" id="remain">10:00</div>
          <div class="pbar"><i id="pfill"></i></div>
        </div>
      </div>
      <div class="cue" id="cue" hidden></div>
      <div class="next" id="next"></div>
      <div class="profile"><canvas id="prof" aria-label="Workout profile. Tap to jump to a point."></canvas></div>
      <div class="totals"><span>Elapsed<b id="elapsed">0:00</b></span><span>Remaining<b id="left">0:00</b></span></div>
      <div class="controls">
        <button id="prev" type="button" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg>Back</button>
        <button id="play" type="button"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4v16l13-8z"/></svg><span id="playTxt">Start</span></button>
        <button id="skip" type="button" aria-label="Skip">Skip<svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg></button>
      </div>
      <div class="aux">
        <label for="sound"><input type="checkbox" id="sound" checked>Beeps at interval changes</label>
        <button class="link" id="restart" type="button">Restart workout</button>
      </div>
    </section>
    <section class="list" aria-label="Intervals">
      <h2>Intervals</h2>
      <ol id="list"></ol>
    </section>
  </main>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const ZN=['Free ride','Recovery','Endurance','Tempo','Threshold','VO2 max','Anaerobic','Neuromuscular'];
const ZMID=[null,.5,.65,.83,.98,1.13,1.35,1.6];
const zoneOf=p=>p==null?0:p<.555?1:p<.755?2:p<.905?3:p<1.055?4:p<1.205?5:p<1.505?6:7;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const r=Math.round;

/* ---------- sample ---------- */
const SAMPLE=(()=>{const iv=[{name:'Warm-up',dur:600,from:.5,to:.75,unit:'pct'}];
  for(let k=1;k<=3;k++){iv.push({name:`Sweet spot ${k}/3`,dur:600,from:.9,to:.9,unit:'pct',cad:[85,95]});iv.push({name:`Recovery ${k}/3`,dur:300,from:.55,to:.55,unit:'pct'});}
  iv.push({name:'Cool-down',dur:480,from:.65,to:.45,unit:'pct'});
  return {name:'Sweet Spot 3×10',source:'sample',file:'',intervals:iv,cues:[{i:1,t:0,msg:'Seated, 85–95 rpm. Hard but steady — you should be able to say short sentences.'}]};})();

/* ---------- FIT ---------- */
function parseFit(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf),td=new TextDecoder();
  if(u8.length<12)throw new Error('This file is too short to be a FIT file.');
  const hs=u8[0],end=Math.min(hs+dv.getUint32(4,true),u8.length);
  const SZ={0:1,1:1,2:1,3:2,4:2,5:4,6:4,7:1,8:4,9:8,10:1,11:2,12:4,13:1,14:8,15:8,16:8};
  const defs={},msgs=[];let p=hs;
  function rd(t,o,s,le){
    if(t===7){let j=o;while(j<o+s&&u8[j]!==0)j++;return td.decode(u8.subarray(o,j)).trim()||null;}
    if(s<(SZ[t]||1))return null;let v;
    switch(t){
      case 0:case 2:case 13:v=u8[o];return v===0xFF?null:v;
      case 10:v=u8[o];return v===0?null:v;
      case 1:v=dv.getInt8(o);return v===0x7F?null:v;
      case 3:v=dv.getInt16(o,le);return v===0x7FFF?null:v;
      case 4:v=dv.getUint16(o,le);return v===0xFFFF?null:v;
      case 11:v=dv.getUint16(o,le);return v===0?null:v;
      case 5:v=dv.getInt32(o,le);return v===0x7FFFFFFF?null:v;
      case 6:v=dv.getUint32(o,le);return v===0xFFFFFFFF?null:v;
      case 12:v=dv.getUint32(o,le);return v===0?null:v;
      case 8:v=dv.getFloat32(o,le);return isFinite(v)?v:null;
      case 9:v=dv.getFloat64(o,le);return isFinite(v)?v:null;
      default:return null;}
  }
  function data(d){const f={};for(const fd of d.fields){if(p+fd.size>u8.length)throw new Error('This FIT file is cut off.');f[fd.num]=rd(fd.type,p,fd.size,d.le);p+=fd.size;}p+=d.dev;msgs.push({num:d.num,f});}
  while(p<end){
    const h=u8[p++];
    if(h&0x80){const d=defs[(h>>5)&3];if(!d)throw new Error('This FIT file could not be read.');data(d);continue;}
    const lt=h&15;
    if(h&0x40){
      p++;const le=u8[p++]===0;const num=dv.getUint16(p,le);p+=2;const nf=u8[p++];const fields=[];
      for(let i=0;i<nf;i++){fields.push({num:u8[p],size:u8[p+1],type:u8[p+2]&31});p+=3;}
      let dev=0;if(h&0x20){const nd=u8[p++];for(let i=0;i<nd;i++){dev+=u8[p+1];p+=3;}}
      defs[lt]={num,le,fields,dev};
    }else{const d=defs[lt];if(!d)throw new Error('This FIT file could not be read.');data(d);}
  }
  return msgs;
}
const INT=['Active','Rest','Warm-up','Cool-down','Recovery','Interval','Other'];
function fitStep(s){
  const iv={name:s[0]||(s[7]!=null&&INT[s[7]])||null,dur:null,from:null,to:null,unit:'pct',note:s[8]||null};
  const dt=s[1],dval=s[2];
  if((dt===0||dt===28)&&dval)iv.dur=dval/1000;
  else iv.open=dt===1&&dval?`Ride ${(dval/100000).toFixed(2)} km, then tap Skip`:dt===2||dt===3?'Until your heart-rate target, then tap Skip':dt===4&&dval?`Burn ${dval} kcal, then tap Skip`:dt===14||dt===15?'Until your power target, then tap Skip':'Open step · tap Skip when done';
  const tt=s[3],tv=s[4],lo=s[5],hi=s[6];
  if([4,7,8,9,10].includes(tt)){
    if(tv>0&&tv<=7){iv.from=iv.to=ZMID[tv];iv.note=[`Power zone ${tv}`,iv.note].filter(Boolean).join(' · ');}
    else if(lo!=null||hi!=null){
      let a=lo??hi,b=hi??lo;const w=a>1000||b>1000;iv.unit=w?'w':'pct';
      const cv=x=>w?(x>1000?x-1000:x):x/100;a=cv(a);b=cv(b);if(a>b)[a,b]=[b,a];
      iv.from=iv.to=(a+b)/2;if(a!==b){iv.lo=a;iv.hi=b;}
    }
  }else if(tt===3&&(lo!=null||hi!=null))iv.cad=[lo??hi,hi??lo];
  else if(tt===1){const h=tv>0&&tv<=5?`HR zone ${tv}`:(lo>100&&hi>100?`HR ${lo-100}–${hi-100} bpm`:null);if(h)iv.note=[h,iv.note].filter(Boolean).join(' · ');}
  if(s[19]===3&&(s[21]!=null||s[22]!=null))iv.cad=[s[21]??s[22],s[22]??s[21]];
  return iv;
}
function fitWorkout(buf){
  const msgs=parseFit(buf);
  const steps=msgs.filter(m=>m.num===27).map((m,k)=>Object.assign({_k:k},m.f));
  if(!steps.length){
    if(msgs.some(m=>m.num===20))throw new Error('This FIT file is a recorded ride, not a planned workout. Export the workout itself (for example from TrainingPeaks, intervals.icu or Garmin Connect) and load that.');
    throw new Error('No workout steps found in this FIT file.');
  }
  steps.sort((a,b)=>(a[254]??a._k)-(b[254]??b._k));
  const pos={};steps.forEach((s,i)=>{pos[s[254]??i]=i;});
  const wk=msgs.find(m=>m.num===26);
  const out=[],cnt={};let i=0,guard=0;
  while(i<steps.length&&guard++<20000){
    const s=steps[i],dt=s[1];
    if(dt===6){const back=pos[s[2]],reps=s[4]||1;cnt[i]=(cnt[i]||0)+1;if(back!=null&&back<i&&cnt[i]<reps){i=back;continue;}cnt[i]=0;i++;continue;}
    if(dt>=7&&dt<=13){i++;continue;}
    out.push(fitStep(s));i++;
  }
  return {name:(wk&&wk.f[8])||null,source:'fit',intervals:out,cues:[]};
}

/* ---------- ZWO ---------- */
function attr(el,...names){const want=names.map(n=>n.toLowerCase());for(const a of el.attributes){if(want.includes(a.name.toLowerCase())){const v=parseFloat(a.value);return isFinite(v)?v:null;}}return null;}
function parseZwo(text){
  const doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('This workout file is not valid XML.');
  const root=doc.documentElement,kid=(el,t)=>[...el.children].find(c=>c.tagName.toLowerCase()===t);
  const wk=kid(root,'workout')||(root.tagName.toLowerCase()==='workout'?root:null);
  if(!wk)throw new Error('No <workout> section found in this file.');
  const nm=kid(root,'name');
  const out=[],cues=[];
  const unitOf=(...v)=>v.some(x=>x!=null&&x>5)?'w':'pct';
  const mid=(l,h)=>l!=null&&h!=null?(l+h)/2:(l??h);
  for(const el of wk.children){
    const t=el.tagName.toLowerCase(),A=(...n)=>attr(el,...n);
    const start=out.length,dur=A('Duration'),c=A('Cadence'),cl=A('CadenceLow'),ch=A('CadenceHigh');
    const cad=cl!=null&&ch!=null?[cl,ch]:c!=null?[c,c]:null;
    if(t==='intervalst'){
      const rep=Math.max(1,r(A('Repeat')||1)),on=A('OnDuration'),off=A('OffDuration');
      const onP=A('OnPower')??mid(A('PowerOnLow'),A('PowerOnHigh')),offP=A('OffPower')??mid(A('PowerOffLow'),A('PowerOffHigh'));
      const cr=A('CadenceResting');
      for(let k=1;k<=rep;k++){
        if(on)out.push({name:`Interval ${k}/${rep}`,dur:on,from:onP,to:onP,unit:unitOf(onP),cad:c!=null?[c,c]:null});
        if(off)out.push({name:`Recovery ${k}/${rep}`,dur:off,from:offP,to:offP,unit:unitOf(offP),cad:cr!=null?[cr,cr]:null});
      }
    }else if(!dur){continue;}
    else if(t==='warmup'||t==='ramp'||t==='cooldown'){
      let a=A('PowerLow'),b=A('PowerHigh');a=a??b;b=b??a;
      if(t==='cooldown'&&a!=null&&a<b)[a,b]=[b,a];
      out.push({name:t==='warmup'?'Warm-up':t==='cooldown'?'Cool-down':'Ramp',dur,from:a,to:b,unit:unitOf(a,b),cad});
    }else if(t==='freeride'||t==='freerun'){out.push({name:'Free ride',dur,from:null,to:null,unit:'pct',cad});}
    else if(t==='maxeffort'){out.push({name:'Max effort',dur,from:null,to:null,unit:'pct',cad,note:'All out'});}
    else{
      const pw=A('Power'),lo=A('PowerLow'),hi=A('PowerHigh');
      if(pw!=null)out.push({name:null,dur,from:pw,to:pw,unit:unitOf(pw),cad});
      else if(lo!=null||hi!=null){const iv={name:null,dur,from:mid(lo,hi),to:mid(lo,hi),unit:unitOf(lo,hi),cad};if(lo!=null&&hi!=null&&lo!==hi){iv.lo=Math.min(lo,hi);iv.hi=Math.max(lo,hi);}out.push(iv);}
      else out.push({name:'Free ride',dur,from:null,to:null,unit:'pct',cad});
    }
    for(const te of el.children){
      if(te.tagName.toLowerCase()!=='textevent'||out.length===start)continue;
      const msg=te.getAttribute('message')||te.getAttribute('Message');if(!msg)continue;
      let off=attr(te,'timeoffset')||0,j=start;
      while(j<out.length-1&&off>=out[j].dur){off-=out[j].dur;j++;}
      cues.push({i:j,t:off,msg});
    }
  }
  return {name:nm?nm.textContent.trim()||null:null,source:'zwo',intervals:out,cues};
}

/* ---------- state ---------- */
let plan,ftp=200,idx=0,e=0,running=false,done=false,last=0,lastSave=0,lastIdx=-1;
let starts=[],total=0,nomTotal=0,openCount=0;
const nd=iv=>iv.dur||60;
const W=(iv,v)=>iv.unit==='w'?v:v*ftp;
const P=(iv,v)=>iv.unit==='w'?v/ftp:v;
const valAt=(iv,t)=>iv.from==null?null:iv.from+(iv.to-iv.from)*(iv.dur?Math.min(1,Math.max(0,t/iv.dur)):0);
const avgPct=iv=>iv.from==null?null:P(iv,(iv.from+iv.to)/2);
const label=iv=>iv.name||ZN[zoneOf(avgPct(iv))];
const tgtText=iv=>iv.from==null?'—':iv.lo!=null?`${r(W(iv,iv.lo))}–${r(W(iv,iv.hi))} W`:iv.from!==iv.to?`${r(W(iv,iv.from))}→${r(W(iv,iv.to))} W`:`${r(W(iv,iv.from))} W`;
function fmt(s){s=Math.max(0,r(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0');}
const key=p=>[p.name,p.file,p.intervals.length,total].join('|');

function setPlan(p,restore){
  plan=p;starts=[];total=0;nomTotal=0;openCount=0;
  p.intervals.forEach(iv=>{starts.push(total);total+=iv.dur||0;nomTotal+=nd(iv);if(!iv.dur)openCount++;});
  idx=0;e=0;done=false;running=false;
  if(restore){const ps=store.get('zfp.pos');if(ps&&ps.key===key(p)&&ps.idx<p.intervals.length){idx=ps.idx;e=ps.e||0;}}
  store.set('zfp.plan',p);
  $('src').textContent=p.source==='sample'?'Sample workout · load your own file':(p.source==='zwo'?'Zwift workout · ':'FIT workout · ')+p.file;
  $('wkName').textContent=p.name||(p.file||'Workout').replace(/\.[^.]+$/,'');
  renderHeader();renderList();render();
}
function renderHeader(){
  let s2=0,d=0;
  for(const iv of plan.intervals){if(!iv.dur||iv.from==null)continue;const a=P(iv,iv.from),b=P(iv,iv.to);s2+=iv.dur*(a*a+a*b+b*b)/3;d+=iv.dur;}
  const parts=[fmt(total)+(openCount?` + ${openCount} open step${openCount>1?'s':''}`:''),`${plan.intervals.length} intervals`];
  if(d){parts.push(`TSS ${r(s2/36)}`);parts.push(`IF ${Math.sqrt(s2/d).toFixed(2)}`);}
  $('wkMeta').textContent=parts.join(' · ');
}
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!=null)n.textContent=txt;return n;}
function renderList(){
  const ol=$('list');
  ol.replaceChildren(...plan.intervals.map((iv,i)=>{
    const li=el('li'),b=el('button');b.type='button';
    b.style.setProperty('--zone',`var(--z${zoneOf(avgPct(iv))})`);
    b.append(el('span','num',String(i+1)),el('span','dot'),el('span','nm',label(iv)),el('span','t',iv.dur?fmt(iv.dur):'open'),el('span','w',tgtText(iv)));
    b.onclick=()=>seek(i,0);li.append(b);return li;}));
  lastIdx=-1;
}
function highlight(){
  const lis=$('list').children;
  [...lis].forEach((li,i)=>{if(i===idx)li.setAttribute('aria-current','step');else li.removeAttribute('aria-current');li.classList.toggle('past',i<idx);});
  const ol=$('list'),li=lis[idx];
  if(li&&ol.scrollHeight>ol.clientHeight+2)ol.scrollTop=Math.max(0,li.offsetTop-ol.clientHeight/3);
  lastIdx=idx;
}

function render(){
  const ivs=plan.intervals,n=ivs.length,iv=ivs[idx],panel=$('panel'),chip=$('chip');
  if(done){
    panel.style.setProperty('--zone','var(--z0)');chip.dataset.z='0';chip.textContent='Done';
    $('stepNo').textContent=`${n} / ${n}`;$('stepName').textContent='Workout complete';$('watts').textContent='—';
    $('sub').textContent=`${fmt(total)} of planned riding`;$('remainLabel').textContent='Interval left';$('remain').textContent='0:00';
    $('pfill').style.width='100%';$('next').textContent='Nice work. Tap Ride again to start over.';$('cue').hidden=true;
    $('elapsed').textContent=fmt(total);$('left').textContent='0:00';
    $('playTxt').textContent='Ride again';$('playIcon').innerHTML='<path d="M7 4v16l13-8z"/>';
    if(lastIdx!==idx)highlight();draw();return;
  }
  const v=valAt(iv,e),pct=v==null?null:P(iv,v),z=zoneOf(pct);
  panel.style.setProperty('--zone',`var(--z${z})`);chip.dataset.z=String(z);chip.textContent=z?`Z${z} · ${ZN[z]}`:'No power target';
  $('stepNo').textContent=`Step ${idx+1} / ${n}`;$('stepName').textContent=label(iv);
  $('watts').textContent=v==null?'—':String(r(W(iv,v)));
  const sub=[];
  if(pct!=null)sub.push(`${r(pct*100)}% FTP`);
  if(iv.lo!=null)sub.push(`range ${r(W(iv,iv.lo))}–${r(W(iv,iv.hi))} W`);
  if(iv.from!=null&&iv.from!==iv.to)sub.push(`ramp ${r(W(iv,iv.from))}→${r(W(iv,iv.to))} W`);
  if(iv.cad)sub.push(iv.cad[0]===iv.cad[1]?`${r(iv.cad[0])} rpm`:`${r(iv.cad[0])}–${r(iv.cad[1])} rpm`);
  if(iv.note)sub.push(iv.note);
  if(v==null&&!iv.note)sub.push('Ride by feel');
  $('sub').textContent=sub.join(' · ');
  if(iv.dur){$('remainLabel').textContent='Interval left';$('remain').textContent=fmt(Math.ceil(iv.dur-e-1e-6));$('pfill').style.width=Math.min(100,e/iv.dur*100)+'%';}
  else{$('remainLabel').textContent=iv.open||'Open step · tap Skip when done';$('remain').textContent='+'+fmt(Math.floor(e));$('pfill').style.width='0%';}
  const nx=$('next');
  if(idx+1<n){const ni=ivs[idx+1];nx.replaceChildren('Next · ',el('b',null,ni.dur?fmt(ni.dur):'open'),' at ',el('b',null,tgtText(ni)),' · '+label(ni));}
  else nx.textContent='Last interval';
  const cue=plan.cues.find(c=>c.i===idx&&e>=c.t&&e<c.t+12);
  $('cue').hidden=!cue;if(cue)$('cue').textContent=cue.msg;
  const el2=starts[idx]+e;$('elapsed').textContent=fmt(el2);$('left').textContent=fmt(total-el2);
  $('playTxt').textContent=running?'Pause':(idx===0&&e===0?'Start':'Resume');
  $('playIcon').innerHTML=running?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>';
  if(lastIdx!==idx)highlight();
  draw();
}

/* ---------- profile ---------- */
const cv=$('prof'),ctx=cv.getContext('2d');
function draw(){
  const rc=cv.getBoundingClientRect();if(!rc.width)return;
  const dpr=window.devicePixelRatio||1,Wd=rc.width,H=rc.height;
  if(cv.width!==r(Wd*dpr)||cv.height!==r(H*dpr)){cv.width=r(Wd*dpr);cv.height=r(H*dpr);}
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,Wd,H);
  const cs=getComputedStyle(document.documentElement),col=k=>cs.getPropertyValue(k).trim();
  let maxP=1.25;for(const iv of plan.intervals){if(iv.from==null)continue;maxP=Math.max(maxP,P(iv,iv.from)*1.06,P(iv,iv.to)*1.06,iv.hi!=null?P(iv,iv.hi)*1.06:0);}
  const top=8,y=p=>H-p/maxP*(H-top),sx=Wd/nomTotal;let x=0;
  plan.intervals.forEach(iv=>{
    const w=nd(iv)*sx,a=iv.from==null?.4:P(iv,iv.from),b=iv.from==null?.4:P(iv,iv.to);
    ctx.fillStyle=col(`--z${iv.from==null?0:zoneOf((a+b)/2)}`);
    ctx.beginPath();ctx.moveTo(x,H);ctx.lineTo(x,y(a));ctx.lineTo(x+w,y(b));ctx.lineTo(x+w,H);ctx.closePath();ctx.fill();
    if(w>3){ctx.fillStyle=col('--surface');ctx.fillRect(x+w-0.75,0,0.75,H);}
    x+=w;});
  const fy=r(y(1))+.5;ctx.strokeStyle=col('--muted');ctx.setLineDash([3,4]);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,fy);ctx.lineTo(Wd,fy);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=col('--muted');ctx.font='500 10px "IBM Plex Mono", monospace';ctx.fillText('FTP',4,fy-4);
  let xc=0;for(let i=0;i<idx;i++)xc+=nd(plan.intervals[i]);const ci=plan.intervals[idx];xc+=done?nd(ci):(ci.dur?Math.min(e,ci.dur):Math.min(e,60));xc*=sx;
  ctx.globalAlpha=.6;ctx.fillStyle=col('--surface');ctx.fillRect(0,0,xc,H);ctx.globalAlpha=1;
  ctx.fillStyle=col('--fg');ctx.fillRect(Math.min(Wd-2,Math.max(0,xc-1)),0,2,H);
}
cv.addEventListener('click',ev=>{
  const rc=cv.getBoundingClientRect(),t=(ev.clientX-rc.left)/rc.width*nomTotal;let acc=0;
  for(let i=0;i<plan.intervals.length;i++){const iv=plan.intervals[i],d=nd(iv);if(t<acc+d){seek(i,iv.dur?t-acc:0);return;}acc+=d;}
});
if(window.ResizeObserver)new ResizeObserver(()=>draw()).observe(cv);
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>draw());
new MutationObserver(()=>draw()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- audio & wake ---------- */
let ac=null,wl=null;
function ensureAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(x){ac=null;}}
function beep(f,d,vol){if(!ac||!$('sound').checked)return;try{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(vol||.25,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.03);}catch(x){}}
async function wake(){try{if(navigator.wakeLock)wl=await navigator.wakeLock.request('screen');}catch(x){wl=null;}}
function unwake(){try{if(wl)wl.release();}catch(x){}wl=null;}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&running)wake();});

/* ---------- control ---------- */
function savePos(){store.set('zfp.pos',{key:key(plan),idx,e});lastSave=Date.now();}
function seek(i,t){done=false;idx=Math.max(0,Math.min(plan.intervals.length-1,i));e=Math.max(0,t||0);savePos();render();}
function finish(){done=true;running=false;unwake();idx=plan.intervals.length-1;e=plan.intervals[idx].dur||0;beep(990,.25);setTimeout(()=>beep(1320,.5),280);store.set('zfp.pos',null);render();}
function advance(dt){
  while(dt>0&&!done){
    const iv=plan.intervals[idx];
    if(!iv.dur){e+=dt;break;}
    const left=iv.dur-e;
    if(dt<left){for(const k of[3,2,1])if(left>k&&left-dt<=k)beep(660,.1);e+=dt;dt=0;}
    else{dt-=left;if(idx+1>=plan.intervals.length){finish();return;}idx++;e=0;beep(990,.35);}
  }
}
setInterval(()=>{if(!running)return;const now=Date.now();advance((now-last)/1000);last=now;if(now-lastSave>5000&&!done)savePos();render();},200);

$('play').onclick=()=>{ensureAudio();if(done){seek(0,0);}running=!running;last=Date.now();if(running)wake();else{unwake();savePos();}render();};
$('prev').onclick=()=>{if(e>3||idx===0)seek(idx,0);else seek(idx-1,0);};
$('skip').onclick=()=>{if(done)return;if(idx+1<plan.intervals.length){seek(idx+1,0);beep(990,.2);}else finish();};
let armT=null;
$('restart').onclick=()=>{const b=$('restart');
  if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Tap again to restart';clearTimeout(armT);armT=setTimeout(()=>{b.classList.remove('armed');b.textContent='Restart workout';},3000);return;}
  clearTimeout(armT);b.classList.remove('armed');b.textContent='Restart workout';running=false;unwake();seek(0,0);};
document.addEventListener('keydown',ev=>{
  if(ev.target.closest&&ev.target.closest('input,textarea,select'))return;
  if(ev.code==='Space'){ev.preventDefault();$('play').click();}
  else if(ev.key==='ArrowRight')$('skip').click();
  else if(ev.key==='ArrowLeft')$('prev').click();
});

const ftpIn=$('ftp');
ftpIn.addEventListener('input',()=>{const v=parseInt(ftpIn.value,10);if(v>=50&&v<=700){ftp=v;store.set('zfp.ftp',v);renderHeader();renderList();render();}});

/* ---------- loading ---------- */
function showErr(m){const x=$('err');x.textContent=m||'';x.hidden=!m;}
async function loadFile(f){
  showErr('');
  try{
    const buf=await f.arrayBuffer(),u8=new Uint8Array(buf);let p;
    if(u8.length>=12&&String.fromCharCode(u8[8],u8[9],u8[10],u8[11])==='.FIT')p=fitWorkout(buf);
    else{const txt=new TextDecoder().decode(u8);if(/<workout/i.test(txt))p=parseZwo(txt);else throw new Error(`“${f.name}” is not a .zwo or .fit workout file.`);}
    if(!p.intervals.length)throw new Error('This workout has no timed steps to play.');
    p.file=f.name;running=false;unwake();setPlan(p,false);savePos();
  }catch(err){showErr((err&&err.message)||'This file could not be read.');}
}
$('loadBtn').onclick=()=>$('file').click();
$('file').onchange=()=>{const f=$('file').files[0];if(f)loadFile(f);$('file').value='';};
let dragN=0;
document.addEventListener('dragenter',ev=>{ev.preventDefault();dragN++;document.body.classList.add('dragging');});
document.addEventListener('dragleave',()=>{if(--dragN<=0){dragN=0;document.body.classList.remove('dragging');}});
document.addEventListener('dragover',ev=>ev.preventDefault());
document.addEventListener('drop',ev=>{ev.preventDefault();dragN=0;document.body.classList.remove('dragging');const f=ev.dataTransfer&&ev.dataTransfer.files[0];if(f)loadFile(f);});

/* ---------- boot ---------- */
const sf=store.get('zfp.ftp');if(sf>=50&&sf<=700){ftp=sf;ftpIn.value=sf;}
const sp=store.get('zfp.plan');
setPlan(sp&&Array.isArray(sp.intervals)&&sp.intervals.length?sp:SAMPLE,true);
})();
</script>
<script>
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body>
